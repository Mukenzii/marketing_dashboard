# Local development Postgres for the Falaq dashboard.
# Runtime connects as the restricted `falaq_app` role (RLS-enforced);
# migrations connect as the `falaq_owner` superuser (DDL).
services:
  db:
    image: postgres:18-alpine
    container_name: falaq_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: falaq_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # consumed by the init script to create the runtime roles
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images store data in a versioned subdir; mount the parent.
      - falaq_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falaq_owner -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  falaq_pgdata:
